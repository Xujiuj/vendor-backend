name: CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-vendor-backend
  cancel-in-progress: true

env:
  DEPLOY_SERVICE: vendor-backend
  APP_PORT: 18000
  SNAIL_PORT: 28080
  DB_NAME: vendor
  DB_PREFIX: VENDOR

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package
        run: mvn -B -Pprod clean package -DskipTests

      - name: Sync vendor business database from runner
        id: sync_business_runner
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Vendor business database sync skipped because database secrets are incomplete."
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          migration_count=0
          if [ -f script/sql/mysql/carbon_vendor_schema_v1.sql ]; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" \
              < script/sql/mysql/carbon_vendor_schema_v1.sql
            migration_count=$((migration_count + 1))
          else
            echo "Vendor base schema file is not present in this repository; skipping base schema sync."
          fi
          for sql_file in \
            script/sql/update/vendor_tenant_package_purchase_fields.sql \
            script/sql/update/vendor_online_purchase_payment_fields.sql \
            script/sql/update/vendor_tenant_package_license_fields.sql \
            script/sql/update/vendor_tenant_package_permission_seed.sql; do
            if [ ! -f "$sql_file" ]; then
              echo "Migration file not present, skipping: $sql_file"
              continue
            fi
            echo "Executing vendor database migration from runner: $(basename "$sql_file")"
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" < "$sql_file"
            migration_count=$((migration_count + 1))
          done
          if [ "$migration_count" -gt 0 ]; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              --batch \
              --skip-column-names \
              "$DB_NAME" \
              -e "select count(*) from information_schema.tables where table_schema = '$DB_NAME' and table_name like 'cv\\_%';"
          else
            echo "No vendor database migration files found; continuing with application deploy."
          fi
          echo "status=success" >> "$GITHUB_OUTPUT"

      - name: Deploy over SSH
        timeout-minutes: 80
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/fx' }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT || 3306 }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_PASSWORD" ] || [ -z "$DB_HOST" ] || [ -z "$DB_USERNAME" ] || [ -z "$DB_PASSWORD" ]; then
            echo "Deployment skipped because deploy or database secrets are incomplete."
            exit 0
          fi
          LOCAL_APP_JAR="ruoyi-admin/target/ruoyi-admin.jar"
          REMOTE_APP_JAR="/tmp/$DEPLOY_SERVICE-${GITHUB_RUN_ID}.jar"
          REPORT_TEMPLATE_ROOT="$DEPLOY_PATH/data/vendor/report-templates"
          VENDOR_SCHEMA_FILE="script/sql/mysql/carbon_vendor_schema_v1.sql"
          REMOTE_SCHEMA="/tmp/carbon_vendor_schema_v1-${GITHUB_RUN_ID}.sql"
          REMOTE_UPDATE_DIR="/tmp/vendor-business-updates-${GITHUB_RUN_ID}"
          timeout 120 sudo apt-get update
          timeout 120 sudo apt-get install -y sshpass
          if [ ! -f "$LOCAL_APP_JAR" ]; then
            echo "Packaged application jar not found at $LOCAL_APP_JAR" >&2
            exit 1
          fi
          SSH_OPTS=(
            -p "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          SCP_OPTS=(
            -P "$DEPLOY_PORT"
            -o StrictHostKeyChecking=accept-new
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=4
          )
          cat > sync-business-db.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S apt-get update
          echo "$SUDO_PASSWORD" | sudo -S apt-get install -y default-mysql-client
          migration_count=0
          if [ -f "$REMOTE_SCHEMA" ]; then
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" \
              < "$REMOTE_SCHEMA"
            migration_count=$((migration_count + 1))
          fi
          shopt -s nullglob
          for sql_file in "$REMOTE_UPDATE_DIR"/*.sql; do
            echo "Executing vendor database migration from target host: $(basename "$sql_file")"
            mysql \
              --connect-timeout=20 \
              --host="$DB_HOST" \
              --port="$DB_PORT" \
              --user="$DB_USERNAME" \
              --password="$DB_PASSWORD" \
              --default-character-set=utf8mb4 \
              "$DB_NAME" < "$sql_file"
            migration_count=$((migration_count + 1))
          done
          if [ "$migration_count" -eq 0 ]; then
            echo "No vendor database migration files found on target host; continuing with application deploy."
          fi
          rm -f "$REMOTE_SCHEMA"
          rm -rf "$REMOTE_UPDATE_DIR"
          EOF
          cat > deploy-backend.sh <<'EOF'
          set -euo pipefail
          echo "$SUDO_PASSWORD" | sudo -S timeout 180 apt-get update
          echo "$SUDO_PASSWORD" | sudo -S timeout 300 apt-get install -y openjdk-17-jdk-headless redis-server curl maven
          echo "$SUDO_PASSWORD" | sudo -S install -d -o "$USER" -g "$USER" "$DEPLOY_PATH/apps/$DEPLOY_SERVICE" "$DEPLOY_PATH/logs/$DEPLOY_SERVICE" "$REPORT_TEMPLATE_ROOT" "$DEPLOY_PATH/src"
          install -m 0644 "$REMOTE_APP_JAR" "$DEPLOY_PATH/apps/$DEPLOY_SERVICE/app.jar"
          rm -f "$REMOTE_APP_JAR"
          echo "$SUDO_PASSWORD" | sudo -S sed -i "s/^# *requirepass .*/requirepass ruoyi123/; s/^requirepass .*/requirepass ruoyi123/" /etc/redis/redis.conf
          if ! echo "$SUDO_PASSWORD" | sudo -S grep -q '^requirepass ' /etc/redis/redis.conf; then
            echo "$SUDO_PASSWORD" | sudo -S sh -c "printf '\nrequirepass ruoyi123\n' >> /etc/redis/redis.conf"
          fi
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable --now redis-server
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart redis-server
          cat > "/tmp/$DEPLOY_SERVICE.service" <<SERVICE
          [Unit]
          Description=$DEPLOY_SERVICE
          After=network.target redis-server.service
          Wants=redis-server.service

          [Service]
          WorkingDirectory=$DEPLOY_PATH/apps/$DEPLOY_SERVICE
          Environment=TZ=Asia/Shanghai
          Environment=SERVER_PORT=$APP_PORT
          Environment=SNAIL_PORT=$SNAIL_PORT
          Environment=SPRING_DATA_REDIS_HOST=127.0.0.1
          Environment=SPRING_DATA_REDIS_PORT=6379
          Environment=SPRING_DATA_REDIS_PASSWORD=ruoyi123
          Environment=${DB_PREFIX}_DB_HOST=$DB_HOST
          Environment=${DB_PREFIX}_DB_PORT=$DB_PORT
          Environment=${DB_PREFIX}_DB_NAME=$DB_NAME
          Environment=${DB_PREFIX}_DB_USERNAME=$DB_USERNAME
          Environment=${DB_PREFIX}_DB_PASSWORD=$DB_PASSWORD
          Environment=CARBON_VENDOR_REPORT_TEMPLATE_ROOT=$REPORT_TEMPLATE_ROOT
          ExecStart=/usr/bin/java -Dserver.port=$APP_PORT -Dsnail-job.port=$SNAIL_PORT -jar app.jar
          Restart=always
          RestartSec=10
          User=$USER

          [Install]
          WantedBy=multi-user.target
          SERVICE
          echo "$SUDO_PASSWORD" | sudo -S mv "/tmp/$DEPLOY_SERVICE.service" "/etc/systemd/system/$DEPLOY_SERVICE.service"
          echo "$SUDO_PASSWORD" | sudo -S systemctl daemon-reload
          echo "$SUDO_PASSWORD" | sudo -S systemctl enable "$DEPLOY_SERVICE"
          echo "$SUDO_PASSWORD" | sudo -S systemctl restart "$DEPLOY_SERVICE"
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 5 "http://127.0.0.1:$APP_PORT/auth/code" | grep -q '"code":200'; then
              echo "$DEPLOY_SERVICE is healthy on 127.0.0.1:$APP_PORT"
              exit 0
            fi
            sleep 5
          done
          echo "$DEPLOY_SERVICE did not become healthy on 127.0.0.1:$APP_PORT" >&2
          echo "$SUDO_PASSWORD" | sudo -S systemctl status "$DEPLOY_SERVICE" --no-pager -l || true
          echo "$SUDO_PASSWORD" | sudo -S journalctl -u "$DEPLOY_SERVICE" -n 160 --no-pager || true
          ss -lntp || true
          exit 1
          EOF
          if [ "${{ steps.sync_business_runner.outputs.status }}" != "success" ]; then
            timeout 60 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf '$REMOTE_UPDATE_DIR' && mkdir -p '$REMOTE_UPDATE_DIR'"
            copied_migration_count=0
            if [ -f "$VENDOR_SCHEMA_FILE" ]; then
              timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$VENDOR_SCHEMA_FILE" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_SCHEMA"
              copied_migration_count=$((copied_migration_count + 1))
            fi
            for sql_file in \
              script/sql/update/vendor_tenant_package_purchase_fields.sql \
              script/sql/update/vendor_online_purchase_payment_fields.sql \
              script/sql/update/vendor_tenant_package_license_fields.sql \
              script/sql/update/vendor_tenant_package_permission_seed.sql; do
              if [ ! -f "$sql_file" ]; then
                echo "Migration file not present for target sync, skipping: $sql_file"
                continue
              fi
              timeout 60 sshpass -p "$DEPLOY_PASSWORD" scp -P "$DEPLOY_PORT" -o StrictHostKeyChecking=accept-new "$sql_file" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_UPDATE_DIR/"
              copied_migration_count=$((copied_migration_count + 1))
            done
            if [ "$copied_migration_count" -gt 0 ]; then
              timeout 300 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
                "DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_SCHEMA='$REMOTE_SCHEMA' REMOTE_UPDATE_DIR='$REMOTE_UPDATE_DIR' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 240 bash -s" < sync-business-db.sh
            else
              echo "No local vendor database migration files found for target sync; continuing with application deploy."
            fi
          fi
          timeout 120 sshpass -p "$DEPLOY_PASSWORD" scp "${SCP_OPTS[@]}" "$LOCAL_APP_JAR" "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_APP_JAR"
          timeout 900 sshpass -p "$DEPLOY_PASSWORD" ssh "${SSH_OPTS[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' DEPLOY_SERVICE='$DEPLOY_SERVICE' APP_PORT='$APP_PORT' SNAIL_PORT='$SNAIL_PORT' DB_PREFIX='$DB_PREFIX' DB_NAME='$DB_NAME' DB_HOST='$DB_HOST' DB_PORT='$DB_PORT' DB_USERNAME='$DB_USERNAME' DB_PASSWORD='$DB_PASSWORD' REMOTE_APP_JAR='$REMOTE_APP_JAR' REPORT_TEMPLATE_ROOT='$REPORT_TEMPLATE_ROOT' SUDO_PASSWORD='$DEPLOY_PASSWORD' timeout 840 bash -s" < deploy-backend.sh
