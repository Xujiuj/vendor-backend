services:
  vendor-redis:
    image: redis:7.4-alpine
    container_name: fx-vendor-redis
    restart: unless-stopped
    command: >
      sh -lc 'if [ -n "$${REDIS_PASSWORD:-}" ]; then
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}";
      else
        exec redis-server --appendonly yes;
      fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - ./data/redis:/data
    networks:
      - fx

  vendor-backend:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/vendor-backend:${IMAGE_TAG}
    container_name: fx-vendor-backend
    restart: unless-stopped
    depends_on:
      - vendor-redis
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8080
      SNAIL_PORT: 28080
      VENDOR_DB_URL: ${VENDOR_DB_URL:?VENDOR_DB_URL is required}
      VENDOR_DB_USERNAME: ${VENDOR_DB_USERNAME:?VENDOR_DB_USERNAME is required}
      VENDOR_DB_PASSWORD: ${VENDOR_DB_PASSWORD:?VENDOR_DB_PASSWORD is required}
      REDIS_HOST: ${REDIS_HOST:-vendor-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      VENDOR_PUBLIC_BASE_URL: ${VENDOR_PUBLIC_BASE_URL:-http://localhost}
      VENDOR_MONITOR_ENABLED: ${VENDOR_MONITOR_ENABLED:-false}
      VENDOR_MONITOR_ADMIN_URL: ${VENDOR_MONITOR_ADMIN_URL:-http://localhost:9090/admin}
      VENDOR_SNAIL_JOB_ENABLED: ${VENDOR_SNAIL_JOB_ENABLED:-false}
      VENDOR_SNAIL_JOB_TOKEN: ${VENDOR_SNAIL_JOB_TOKEN:-}
      VENDOR_SNAIL_JOB_SERVER_HOST: ${VENDOR_SNAIL_JOB_SERVER_HOST:-127.0.0.1}
      VENDOR_SNAIL_JOB_SERVER_PORT: ${VENDOR_SNAIL_JOB_SERVER_PORT:-17888}
      VENDOR_CASHIER_BASE_URL: ${VENDOR_CASHIER_BASE_URL:-https://vendor.example.com/pay}
      VENDOR_PAYMENT_REQUIRE_SIGNATURE: ${VENDOR_PAYMENT_REQUIRE_SIGNATURE:-true}
      VENDOR_WECHAT_PAY_ENABLED: ${VENDOR_WECHAT_PAY_ENABLED:-false}
      VENDOR_WECHAT_APP_ID: ${VENDOR_WECHAT_APP_ID:-}
      VENDOR_WECHAT_MERCHANT_ID: ${VENDOR_WECHAT_MERCHANT_ID:-}
      VENDOR_WECHAT_NOTIFY_URL: ${VENDOR_WECHAT_NOTIFY_URL:-}
      VENDOR_WECHAT_API_V3_KEY: ${VENDOR_WECHAT_API_V3_KEY:-}
      VENDOR_WECHAT_PLATFORM_CERTIFICATE: ${VENDOR_WECHAT_PLATFORM_CERTIFICATE:-}
      VENDOR_ALIPAY_ENABLED: ${VENDOR_ALIPAY_ENABLED:-false}
      VENDOR_ALIPAY_APP_ID: ${VENDOR_ALIPAY_APP_ID:-}
      VENDOR_ALIPAY_SELLER_ID: ${VENDOR_ALIPAY_SELLER_ID:-}
      VENDOR_ALIPAY_NOTIFY_URL: ${VENDOR_ALIPAY_NOTIFY_URL:-}
      VENDOR_ALIPAY_PUBLIC_KEY: ${VENDOR_ALIPAY_PUBLIC_KEY:-}
      JAVA_OPTS: ${VENDOR_BACKEND_JAVA_OPTS:-}
    ports:
      - "${VENDOR_BACKEND_PORT:-18000}:8080"
      - "${VENDOR_SNAIL_PORT:-28080}:28080"
    volumes:
      - ./logs/vendor-backend:/ruoyi/server/logs
      - ${FX_LICENSE_SECRET_DIR:-/opt/fx/secrets}:/opt/fx/secrets:ro
    networks:
      - fx

networks:
  fx:
    name: ${FX_DOCKER_NETWORK:-fx-delivery}
    driver: bridge
